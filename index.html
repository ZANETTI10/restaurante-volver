<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Volver · Gestión de reservas</title>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,200;9..144,300;9..144,400&family=Martian+Mono:wght@300;400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --olive:#2F3809; --olive-2:#434d1a; --sage:#868A75; --sand:#B2AA9F; --beige:#EFEEEC; --paper:#F7F6F3;
  --ink:#333; --warm:#5B5754; --pink:#CC3366; --pink-soft:#F7E1E9; --amber:#FB9139; --amber-soft:#FDEBDC;
  --ok:#5E7A2E; --ok-soft:#E6EDD8; --blue:#3D5A80; --blue-soft:#E3EAF3; --line:#DDD9D2; --white:#fff;
  color-scheme:light;
  --serif:"Fraunces", Georgia, serif; --mono:"Martian Mono", ui-monospace, monospace; --sans:"Inter", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--sans);color:var(--ink);background:var(--beige);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--olive);color:#EDEFE3;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:26px 0 18px}
.brand{padding:0 24px 20px;border-bottom:1px solid rgba(255,255,255,.12)}
.brand .word{font-family:var(--serif);font-weight:200;font-size:38px;letter-spacing:-.5px;line-height:1}
.brand .sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;opacity:.65;margin-top:8px}
.nav{padding:14px 12px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;text-decoration:none;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:rgba(237,239,227,.78);border-left:2px solid transparent}
.nav a:hover{color:#fff;background:rgba(255,255,255,.05)}
.nav a.on{color:#fff;border-left-color:var(--pink);background:rgba(255,255,255,.08)}
.nav svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5}
.nav .badge{margin-left:auto;background:var(--pink);color:#fff;font-size:10px;padding:1px 6px;letter-spacing:0}
.who{margin:0 12px 10px;padding:12px;border:1px solid rgba(255,255,255,.15);font-size:13px}
.who small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin-bottom:3px}
.who button{background:none;border:0;color:#fff;opacity:.7;font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;padding:0;margin-top:6px;text-decoration:underline}
.side .foot{padding:0 24px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;opacity:.55;line-height:1.6}
main{padding:30px 40px 90px;max-width:1300px;width:100%}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:22px;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage);margin-bottom:6px}
h1,h2{text-wrap:balance}
.btn:focus-visible,.in:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1{font-family:var(--serif);font-weight:200;font-size:46px;line-height:1.02;margin:0;color:var(--olive);letter-spacing:-.6px}
h2{font-family:var(--serif);font-weight:300;font-size:24px;margin:0 0 4px;color:var(--olive)}
h3{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin:0;color:var(--warm)}
.muted{color:var(--warm)} .small{font-size:13px} .lead{margin:-10px 0 20px;max-width:720px;color:var(--warm)}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:.02em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--olive);background:var(--olive);color:#fff;padding:11px 18px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border-radius:0;min-height:44px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--olive-2)}
.btn.ghost{background:transparent;color:var(--olive)} .btn.ghost:hover{background:rgba(47,56,9,.06)}
.btn.pink{background:var(--pink);border-color:var(--pink)} .btn.pink:hover{background:#b52a58}
.btn.wa{background:#1F7A4D;border-color:#1F7A4D}
.btn.sm{padding:6px 11px;min-height:34px;font-size:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.card{background:var(--white);border:1px solid var(--line);padding:20px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)} .g2{grid-template-columns:1.35fr 1fr} .g2e{grid-template-columns:1fr 1fr}
.kpi{background:var(--white);border:1px solid var(--line);padding:18px 20px;cursor:pointer;transition:border-color .15s}
.kpi:hover{border-color:var(--sage)}
.kpi .n{font-family:var(--serif);font-weight:300;font-size:34px;color:var(--olive);line-height:1.1;margin-top:6px}
.kpi .d{font-size:12.5px;color:var(--warm);margin-top:2px}
.kpi.alert{border-color:var(--pink);background:#FFFAFC} .kpi.alert .n{color:var(--pink)}
.areas{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.area{background:var(--paper);border:1px solid var(--line);padding:20px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:150px;transition:all .15s}
.area:hover{background:var(--white);border-color:var(--olive);transform:translateY(-2px)}
.area .ic{width:38px;height:38px;border:1px solid var(--olive);display:grid;place-items:center;color:var(--olive)}
.area .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.5}
.area .t{font-family:var(--serif);font-size:22px;font-weight:300;color:var(--olive)}
.area .s{font-size:13px;color:var(--warm)}
.area .cnt{font-family:var(--mono);font-size:10px;color:var(--pink);letter-spacing:.06em;text-transform:uppercase}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:14px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.time{font-family:var(--mono);font-size:13px;color:var(--olive);width:58px;flex:none}
.item .main{flex:1;min-width:0}
.item .name{font-weight:500}
.item .meta{font-size:12.5px;color:var(--warm)}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border:1px solid var(--line);color:var(--warm);background:var(--paper);white-space:nowrap}
.tag.pink{border-color:var(--pink);color:var(--pink);background:var(--pink-soft)}
.tag.ok{border-color:#A9BC85;color:var(--ok);background:var(--ok-soft)}
.tag.amber{border-color:#F3B987;color:#A85A16;background:var(--amber-soft)}
.tag.blue{border-color:#A9BBD3;color:var(--blue);background:var(--blue-soft)}
.tag.olive{border-color:var(--olive);color:#fff;background:var(--olive)}
.empty{padding:26px;text-align:center;color:var(--warm);font-size:14px;border:1px dashed var(--line);background:var(--paper)}
.tbl{width:100%;border-collapse:collapse;background:var(--white);border:1px solid var(--line)}
.tbl th{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;color:var(--warm);text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);background:var(--paper)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:#FBFAF7}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--olive);flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:9px 13px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;color:var(--olive);min-height:40px}
.seg button.on{background:var(--olive);color:#fff}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding:12px 14px 12px 40px;border:1px solid var(--line);background:var(--white);border-radius:0;outline:none;min-height:46px}
.search input:focus{border-color:var(--olive)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--sage);fill:none;stroke-width:1.8}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.fgrid .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:6px}
label.f>span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--warm)}
label.f>span b{color:var(--pink);font-weight:400}
label.f>span.errmsg{font-family:var(--sans);font-size:12.5px;letter-spacing:0;text-transform:none;color:var(--pink)}
.in{padding:11px 12px;border:1px solid var(--line);background:var(--white);border-radius:0;outline:none;width:100%;min-height:46px}
.in:focus{border-color:var(--olive);box-shadow:0 0 0 3px rgba(47,56,9,.08)}
.in.err{border-color:var(--pink);background:#FFF8FA}
.errmsg{font-size:12.5px;color:var(--pink)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice button{border:1px solid var(--line);background:var(--white);padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.choice button strong{font-family:var(--serif);font-weight:300;font-size:20px;color:var(--olive)}
.choice button span{font-size:12.5px;color:var(--warm)}
.choice button.on{border-color:var(--olive);box-shadow:inset 0 0 0 1px var(--olive);background:#FAFBF5}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--white);padding:9px 13px;cursor:pointer;font-size:13.5px;min-height:40px}
.chips button.on{border-color:var(--olive);background:var(--olive);color:#fff}
.aviso{border:1px solid var(--olive);background:#FAFBF5;padding:16px 18px;margin:16px 0}
.aviso p{margin:0 0 10px;font-family:var(--serif);font-size:17px;font-weight:300;color:var(--olive);line-height:1.35}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--olive);flex:none}
.scrim{position:fixed;inset:0;background:rgba(36,40,20,.45);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:50;overflow:auto;animation:fade .15s}
.modal{background:var(--paper);width:100%;max-width:740px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.25);animation:rise .2s}
.modal.sm{max-width:500px}
.modal .mh{display:flex;align-items:flex-start;gap:12px;padding:22px 26px 14px;border-bottom:1px solid var(--line);background:var(--white)}
.modal .mb{padding:22px 26px}
.modal .mf{display:flex;gap:10px;padding:16px 26px;border-top:1px solid var(--line);background:var(--white);justify-content:flex-end;flex-wrap:wrap}
.x{border:0;background:none;cursor:pointer;padding:4px;margin-left:auto;color:var(--warm)}
.x svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.6;fill:none}
.scrim.still,.scrim.still .modal{animation:none}
@keyframes fade{from{opacity:0}} @keyframes rise{from{transform:translateY(12px);opacity:0}}
.steps{display:flex;margin-top:14px}
.steps div{flex:1;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--sand);padding-top:9px;border-top:2px solid var(--line)}
.steps div.on{color:var(--olive);border-top-color:var(--olive)} .steps div.done{color:var(--sage);border-top-color:var(--sage)}
.banner{display:flex;gap:14px;padding:16px 18px;border:1px solid var(--pink);background:var(--pink-soft);margin-bottom:16px;align-items:flex-start}
.banner .bi{width:34px;height:34px;background:var(--pink);color:#fff;display:grid;place-items:center;flex:none}
.banner .bi svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.banner .bt{font-family:var(--serif);font-size:21px;font-weight:300;color:#8E1E46;line-height:1.2}
.banner.ok{border-color:#A9BC85;background:var(--ok-soft)} .banner.ok .bi{background:var(--ok)} .banner.ok .bt{color:var(--ok)}
.banner.info{border-color:var(--line);background:var(--white)} .banner.info .bi{background:var(--sage)} .banner.info .bt{color:var(--olive)}
.banner.blue{border-color:#A9BBD3;background:var(--blue-soft)} .banner.blue .bi{background:var(--blue)} .banner.blue .bt{color:var(--blue)}
.pulse{animation:pulse 1.6s ease-in-out 2}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(204,51,102,.18)}}
.zones{display:flex;flex-direction:column;gap:16px}
.zone{background:var(--white);border:1px solid var(--line);padding:18px}
.zone .zt{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.mesa{position:relative;border:1px solid var(--line);background:var(--paper);padding:10px;cursor:pointer;min-height:86px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:transform .12s}
.mesa:hover{transform:translateY(-2px);border-color:var(--sage)}
.mesa .mn{font-family:var(--serif);font-size:24px;font-weight:300;line-height:1}
.mesa .mc{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--warm)}
.mesa .wh{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mesa.reservada{background:#FAF3E8;border-color:#E8C9A0}
.mesa.ocupada{background:var(--olive);border-color:var(--olive);color:#fff} .mesa.ocupada .mc{color:rgba(255,255,255,.7)}
.mesa.cuenta{background:var(--amber-soft);border-color:var(--amber)}
.mesa .flag{position:absolute;top:-7px;right:-7px;background:var(--pink);color:#fff;font-family:var(--mono);font-size:10px;width:22px;height:22px;display:grid;place-items:center;border-radius:50%;box-shadow:0 0 0 2px var(--white)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--warm)}
.legend i{display:inline-block;width:12px;height:12px;border:1px solid var(--line);margin-right:6px;vertical-align:-1px}
.kv{display:grid;grid-template-columns:170px 1fr auto;border:1px solid var(--line);background:var(--white)}
.kv>div{padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}
.kv>div:nth-last-child(-n+3){border-bottom:0}
.kv .k{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--warm);background:var(--paper)}
.copy{border:0;background:none;cursor:pointer;color:var(--sage);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:4px}
.copy:hover{color:var(--olive)}
.flow{display:flex;gap:0;margin:6px 0 4px;flex-wrap:wrap}
.flow span{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border:1px solid var(--line);margin-right:-1px;color:var(--sand);background:var(--white)}
.flow span.done{color:var(--ok);background:var(--ok-soft);border-color:#A9BC85}
.flow span.now{color:#fff;background:var(--olive);border-color:var(--olive)}
.picker{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);background:var(--white);padding:12px}
.pzt{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--warm);margin-bottom:6px}
.pzg{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.pm{border:1px solid var(--line);background:var(--paper);min-height:46px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px}
.pm b{font-family:var(--serif);font-weight:300;font-size:17px;line-height:1}
.pm small{font-family:var(--mono);font-size:8.5px;color:var(--warm)}
.pm:hover{border-color:var(--olive)}
.pm.on{background:var(--olive);border-color:var(--olive);color:#fff} .pm.on small{color:rgba(255,255,255,.75)}
.pm[disabled]{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.evc{display:flex;gap:14px;text-align:left;background:var(--white);border:1px solid var(--line);padding:14px;cursor:pointer;transition:border-color .15s}
.evc:hover{border-color:var(--olive)}
.evd{width:58px;flex:none;border-right:1px solid var(--line);padding-right:12px;display:flex;flex-direction:column;align-items:center}
.evd b{font-family:var(--serif);font-weight:300;font-size:32px;line-height:1;color:var(--olive)}
.evd span{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--warm)}
.evd small{font-family:var(--mono);font-size:10px;color:var(--sage);margin-top:6px}
.evb{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.evb .name{font-weight:500}.evb .meta{font-size:12.5px;color:var(--warm)}
.bar{height:6px;background:var(--beige);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--olive)}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:-6px 0 18px;gap:4px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:10px 12px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--warm);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--olive);border-bottom-color:var(--pink)}
.tortabox{border:1px solid var(--line);background:var(--white);padding:12px 14px}
.tortabox>.row{justify-content:space-between}
.sopwait{min-height:40px}
.drop{border:1px dashed var(--sage);background:var(--white);padding:16px;text-align:center;cursor:pointer;color:var(--warm);font-size:13.5px;display:block}
.drop:hover{border-color:var(--olive);color:var(--olive)}
.thumb{max-width:100%;max-height:340px;display:block;margin:10px auto 0;border:1px solid var(--line)}
.bono{border:1px solid var(--olive);background:var(--white);padding:22px;text-align:center;position:relative}
.bono .w{font-family:var(--serif);font-weight:200;font-size:40px;color:var(--olive);line-height:1}
.bono .v{font-family:var(--serif);font-weight:300;font-size:34px;color:var(--pink);margin:10px 0 2px}
.bono .c{font-family:var(--mono);font-size:15px;letter-spacing:.14em;border:1px dashed var(--sage);display:inline-block;padding:6px 12px;margin-top:10px}
.roles{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px 16px;background:var(--beige)}
.roles .box{max-width:920px;width:100%}
.roles .word{font-family:var(--serif);font-weight:200;font-size:72px;color:var(--olive);line-height:1;text-align:center}
.roles p{text-align:center;font-family:var(--serif);font-size:22px;font-weight:300;color:var(--warm);margin:10px 0 30px}
.reg{min-height:100vh;background:var(--beige);display:flex;justify-content:center;padding:36px 16px}
.reg .box{max-width:560px;width:100%}
.reg .hero{text-align:center;margin-bottom:24px}
.reg .hero .word{font-family:var(--serif);font-weight:200;font-size:64px;color:var(--olive);line-height:1}
.reg .hero p{font-family:var(--serif);font-size:20px;font-weight:300;color:var(--warm);margin:10px 0 0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--olive);color:#fff;padding:12px 18px;font-size:14px;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:rise .2s;max-width:90vw}

<body>

<script>
/* =============================================================
   VOLVER · Versión de PRUEBA
   Reservas → datos de facturación → anticipos con soporte →
   verificación (tesorería) → aplicación en caja → ajuste contable.
   Bonos vendidos y de cortesía con trazabilidad. Mesas.
   Los datos son de ejemplo y viven en memoria: se reinician al recargar.
   ============================================================= */

/* ---------- configuración ---------- */
const ZONAS = [
  {id:'adentro', nombre:'Adentro', mesas:Array.from({length:35},(_,i)=>[String(i+1),4])},
  {id:'terraza', nombre:'Terraza', mesas:[['T1',6]]},
  {id:'afuera',  nombre:'Afuera',  mesas:[['F1',4],['F2',4],['F3',4],['F4',6],['F5',6],['F6',8]]},
];
const MESAS = ZONAS.flatMap(z=>z.mesas.map(([id,cap])=>({id,cap,zona:z.nombre})));
const mesaById = id => MESAS.find(m=>m.id===id);
const mesasDe = r => r ? (r.mesas || (r.mesa?[r.mesa]:[])) : [];
const mesasTxt = r => { const m=mesasDe(r); return !m.length?'':m.length===1?mesaLabel(m[0]):m.length+' mesas'+(m.length<=4?' ('+m.join(', ')+')':''); };
const capDe = ids => ids.reduce((s,id)=>s+(mesaById(id)?.cap||0),0);
const hmMin = h => { const [a,b]=(h||'0:0').split(':').map(Number); return a*60+b; };
/* Mesas ya tomadas por otras reservas el mismo día en una franja de 2,5 h */
const mesasOcupadasEn = (fecha,hora,exceptId) => { const s=new Set(); vals('reservas').filter(r=>r.id!==exceptId && r.fecha===fecha && ['Pendiente','Confirmada','Llegó'].includes(r.estado) && Math.abs(hmMin(r.hora)-hmMin(hora))<150).forEach(r=>mesasDe(r).forEach(m=>s.add(m))); return s; };
const mesaLabel = id => !id ? '' : (/^\d+$/.test(id) ? 'Mesa '+id : id.startsWith('T') ? 'Terraza' : 'Afuera '+id.slice(1));

const TIPOS_DOC = ['CC · Cédula de ciudadanía','CE · Cédula de extranjería','NIT','PA · Pasaporte','PPT · Permiso por protección temporal','TI · Tarjeta de identidad','DE · Documento extranjero'];
const TIPOS_RES = ['Restaurante','Evento','Torta / Celebración','Otro'];
const ORIGENES = ['WhatsApp','Apparta','Teléfono','Instagram','Presencial'];
const MEDIOS = ['Wompi','Transferencia','Datáfono','Efectivo','QR'];
const ESTADOS_RES = ['Pendiente','Confirmada','Llegó','Finalizada','No asistió','Cancelada'];
const CUENTA_ANT = '28050501';
const AVISO = 'Si necesitas factura electrónica a tu nombre o con los datos de tu empresa, solicítala ahora, antes de finalizar tu reserva y tu compra. Por políticas contables, una vez emitida la factura no podemos cambiar los datos.';
const ROLES = [
  {id:'reservas', nombre:'Reservas', persona:'Encargada de reservas', d:'Toma reservas, pide datos de facturación y registra anticipos con su soporte', ic:'cal', inicio:'inicio'},
  {id:'caja', nombre:'Caja', persona:'Cajero(a) de turno', d:'Factura en SIESA con aviso de anticipos y bonos del cliente', ic:'cash', inicio:'caja'},
  {id:'tesoreria', nombre:'Tesorería y contabilidad', persona:'Tesorería y contador(a)', d:'Verifica pagos, recibos de caja, ajustes contables y terceros', ic:'book', inicio:'contabilidad'},
  {id:'admin', nombre:'Gerencia / Administración', persona:'Gerencia, líderes y administradora', d:'Ve todo: tablero de eventos, cartera y cortesías', ic:'star', inicio:'inicio'},
];
/* Flujo del anticipo (refleja el proceso contable de Volver) */
const FLUJO = ['Por verificar','Verificado','Aplicado en factura','Conciliado'];
const PEND_CRUCE = ['Por verificar','Verificado'];

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(Number(n)||0);
const pad = n => String(n).padStart(2,'0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => dstr(new Date());
const nowHM = () => new Date().toTimeString().slice(0,5);
const addDays = (s,n) => { const d = new Date(s+'T12:00'); d.setDate(d.getDate()+n); return dstr(d); };
const fdate = s => s ? new Date(s+'T12:00').toLocaleDateString('es-CO',{day:'numeric',month:'short',year:s.slice(0,4)!==today().slice(0,4)?'numeric':undefined}) : '—';
const fdateLong = s => new Date(s+'T12:00').toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long',year:s.slice(0,4)!==today().slice(0,4)?'numeric':undefined});
const uid = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const norm = s => String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const digits = s => String(s||'').replace(/\D/g,'');
const ICON = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="1"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  table:'<circle cx="12" cy="12" r="5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/>',
  cash:'<rect x="3" y="6" width="18" height="12" rx="1"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9v.01M18 15v.01"/>',
  coin:'<circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .9-3 2s1.3 1.7 3 2 3 .9 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6v2M12 16v2"/>',
  gift:'<rect x="3" y="8" width="18" height="13" rx="1"/><path d="M3 12h18M12 8v13M12 8c-2-4-6-4-6-1.5S9 8 12 8c3 0 6-.5 6-1.5S14 4 12 8"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.5 3.3-5.5 6.5-5.5s5.9 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c2 .8 3.2 2.6 3.5 5.2"/>',
  book:'<path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/><path d="M4 17a3 3 0 0 1 3-3h11"/>',
  star:'<path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8 6.6 19.7l1.1-6.1L3.2 9.4l6.1-.8z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>', search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.01"/>', check:'<path d="M5 12l5 5 9-10"/>', form:'<rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 8h6M9 12h6M9 16h3"/>',
  wa:'<path d="M4 20l1.3-4A8 8 0 1 1 8 18.7z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8c-1-.4-1.8-1.2-2.2-2.2l.8-1-1-2z"/>',
  wallet:'<path d="M3 7a2 2 0 0 1 2-2h12v4"/><rect x="3" y="7" width="18" height="13" rx="1"/><path d="M16 13.5h2"/>',
  cake:'<path d="M4 21h16M5 21v-7h14v7M5 17c2 1 3-1 4.7 0s3 1 4.6 0 3-1 4.7 0M12 14V9M12 6.5V5"/>',
  spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>', clip:'<path d="M20 11l-8.5 8.5a5 5 0 0 1-7-7L13 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L14 7"/>'
};
const ic = (n,st='') => `<svg viewBox="0 0 24 24" ${st?`style="${st}"`:''}>${ICON[n]||''}</svg>`;
function toast(msg){ document.querySelectorAll('.toast').forEach(t=>t.remove()); const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }
async function copyText(txt){ try{ await navigator.clipboard.writeText(txt); toast('Copiado'); }catch(e){ toast('No se pudo copiar: selecciónalo a mano'); } }
const waLink = (tel, text) => `https://wa.me/57${digits(tel).slice(-10)}?text=${encodeURIComponent(text)}`;
function dvNit(n){ const p=[3,7,13,17,19,23,29,37,41,43,47,53,59,67,71]; const d=digits(n).split('').reverse(); if(!d.length) return ''; let s=0; d.forEach((x,i)=>s+=Number(x)*p[i]); const r=s%11; return String(r>1?11-r:r); }
let ROLE = null; try{ ROLE = JSON.parse(sessionStorage.getItem('volver-rol')||'null'); }catch(e){}
const rol = () => ROLES.find(r=>r.id===ROLE?.id);
const puedeMesas = () => ['reservas','admin'].includes(ROLE?.id); /* asignar mesas es interno: solo Reservas y Administración */
const quien = () => ROLE ? (ROLE.nombre || rol()?.nombre) : 'Sin usuario';

/* ---------- datos en memoria (prueba) ---------- */
const S = {clientes:{}, reservas:{}, anticipos:{}, mesas:{}, bonos:{}, soportes:{}, cartera:{}};
const vals = c => Object.values(S[c]);
/* ---------- capa de datos ----------
   Modo DEMO: sin config.js → datos de ejemplo en memoria.
   Modo REAL: config.js con supabaseUrl y supabaseAnonKey → Supabase (login, roles, tiempo real). */
const CFG = window.VOLVER_CONFIG || {};
const REAL = !!(CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase);
const TABLAS = ['clientes','reservas','anticipos','mesas','bonos','cartera'];
let SB = null, USER = null, PERFIL = null, CARGANDO = REAL, ERROR_CARGA = '';
if(REAL) SB = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey);
function limpio(data){ const d = JSON.parse(JSON.stringify(data)); delete d.id; return d; }
function save(col,id,data){
  S[col][id] = {...data, id}; render();
  if(!REAL) return;
  SB.from(col).upsert({id, data:limpio(data), updated_by:USER?.id}).then(({error})=>{ if(error){ console.error(error); toast('No se pudo guardar en la base de datos: '+(error.message||'error')); } });
}
function removeDoc(col,id){
  delete S[col][id]; render();
  if(REAL) SB.from(col).delete().eq('id',id).then(({error})=>{ if(error) toast('No se pudo borrar: '+error.message); });
}
/* Soportes de pago: en modo real van al bucket privado "soportes" de Supabase Storage */
function guardarSoporte(sid, sop){
  S.soportes[sid] = sop;
  if(!REAL) return;
  const ext = sop.data.startsWith('data:application/pdf') ? 'pdf' : 'jpg';
  fetch(sop.data).then(r=>r.blob()).then(blob=>SB.storage.from('soportes').upload(`${today().slice(0,7)}/${sid}.${ext}`, blob, {contentType:blob.type, upsert:true}))
    .then(({error})=>{ if(error) toast('No se pudo subir el soporte: '+error.message); else S.soportes[sid].ruta=`${today().slice(0,7)}/${sid}.${ext}`; });
}
function soporteHTML(sid){
  const s = sid && S.soportes[sid];
  if(s && s.data){ return s.data.startsWith('data:application/pdf') ? `<div class="empty">PDF adjunto: ${esc(s.nombre||'')}</div>` : `<img class="thumb" src="${s.data}" alt="Soporte del pago">`; }
  if(sid && REAL) return `<div class="sopwait" data-sop="${esc(sid)}"><div class="empty" style="padding:14px">Cargando soporte…</div></div>`;
  return '';
}
async function hidratarSoportes(){
  if(!REAL) return;
  for(const el of document.querySelectorAll('[data-sop]')){
    const sid = el.dataset.sop; el.removeAttribute('data-sop');
    const mes = (Object.values(S.anticipos).find(a=>a.soporteId===sid)||Object.values(S.bonos).find(b=>b.soporteId===sid)||{}).soporteMes;
    const {data:list} = await SB.storage.from('soportes').list(mes||'', {search:sid});
    const f = (list||[])[0]; if(!f){ el.innerHTML='<div class="empty" style="padding:14px">No se encontró el archivo del soporte.</div>'; continue; }
    const ruta = (mes?mes+'/':'')+f.name;
    const {data} = await SB.storage.from('soportes').createSignedUrl(ruta, 900);
    if(!data){ continue; }
    el.innerHTML = f.name.endsWith('.pdf') ? `<a class="btn sm ghost" href="${data.signedUrl}" target="_blank" rel="noopener">Abrir PDF del soporte</a>` : `<img class="thumb" src="${data.signedUrl}" alt="Soporte del pago">`;
  }
}
async function iniciarReal(){
  const {data:{session}} = await SB.auth.getSession();
  USER = session?.user || null;
  if(!USER){ CARGANDO=false; render(); return; }
  const {data:perfil, error} = await SB.from('perfiles').select('*').eq('user_id',USER.id).maybeSingle();
  if(error || !perfil || !perfil.activo){ ERROR_CARGA = error ? error.message : 'Tu usuario no tiene un perfil activo. Pídele a Gerencia que lo active.'; CARGANDO=false; render(); return; }
  PERFIL = perfil; ROLE = {id:perfil.rol, nombre:perfil.nombre};
  for(const t of TABLAS){
    const {data, error:e} = await SB.from(t).select('id,data').limit(5000);
    if(e){ ERROR_CARGA='No se pudo leer '+t+': '+e.message; break; }
    S[t] = {}; (data||[]).forEach(row=>{ S[t][row.id] = {...row.data, id:row.id}; });
  }
  SB.channel('volver-cambios').on('postgres_changes',{event:'*',schema:'public'},p=>{
    if(!TABLAS.includes(p.table)) return;
    if(p.eventType==='DELETE') delete S[p.table][p.old.id]; else S[p.table][p.new.id] = {...p.new.data, id:p.new.id};
    render();
  }).subscribe();
  CARGANDO=false; if(!location.hash || location.hash==='#') location.hash = rol()?.inicio||'inicio'; render();
}
function viewLogin(){
  if(CARGANDO) return `<div class="roles"><div class="box"><div class="word">volver</div><p>Cargando…</p></div></div>`;
  return `<div class="roles"><div class="box" style="max-width:420px"><div class="word">volver</div><p>Ingresa con tu usuario</p>
    ${ERROR_CARGA?`<div class="banner"><div class="bi">${ic('alert')}</div><div class="small">${esc(ERROR_CARGA)}</div></div>`:''}
    <form class="card" id="loginForm" style="display:flex;flex-direction:column;gap:14px">
      <label class="f"><span>Correo</span><input class="in" id="lgMail" type="email" autocomplete="username" required></label>
      <label class="f"><span>Contraseña</span><input class="in" id="lgPass" type="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit">Entrar</button><div class="errmsg" id="lgErr"></div></form>
    <p class="small" style="font-family:var(--sans);font-size:13px">¿Olvidaste la contraseña? Pídele a Gerencia que te la restablezca.</p></div></div>`;
}
function bindLogin(){
  const f = $('#loginForm'); if(!f) return;
  f.onsubmit = async e=>{ e.preventDefault(); $('#lgErr').textContent='';
    const {error} = await SB.auth.signInWithPassword({email:$('#lgMail').value.trim(), password:$('#lgPass').value});
    if(error){ $('#lgErr').textContent = 'Correo o contraseña incorrectos.'; return; }
    ERROR_CARGA=''; CARGANDO=true; render(); iniciarReal(); };
}
async function cerrarSesion(){ if(REAL){ await SB.auth.signOut(); location.hash=''; location.reload(); } }
function hist(obj, txt){ return [...(obj.hist||[]), {f:today(), h:nowHM(), u:quien(), t:txt}]; }

const cliente = id => S.clientes[id];
const nombreDe = o => (o.clienteId && cliente(o.clienteId)?.nombre) || o.clienteNombre || 'Sin cliente';

const cruzarDe = cid => porCruzar().filter(a=>a.clienteId===cid);
const total = arr => arr.reduce((s,a)=>s+(Number(a.valor)||0),0);
const vencidos = () => porCruzar().filter(a=>a.fechaAplicacion && a.fechaAplicacion < today());
const sinCliente = () => porCruzar().filter(a=>!a.clienteId);
const porVerificar = () => vals('anticipos').filter(a=>a.estado==='Por verificar');
const porAjustar = () => vals('anticipos').filter(a=>a.estado==='Aplicado en factura');
const devoluciones = () => vals('anticipos').filter(a=>a.estado==='Devolución solicitada');
const tercerosPorCrear = () => vals('clientes').filter(c=>c.facturaPropia && c.siesa!=='Creado');
const bonoEstado = b => b.estado==='Activo' && b.vence && b.vence < today() ? 'Vencido' : b.estado;
const bonosActivos = () => vals('bonos').filter(b=>bonoEstado(b)==='Activo');
const bonosPorVencer = () => bonosActivos().filter(b=>b.vence && b.vence <= addDays(today(),30));
const bonosDe = c => bonosActivos().filter(b=>(c.telefono && digits(b.telefono)===c.telefono) || norm(b.beneficiario)===norm(c.nombre) || norm(b.comprador)===norm(c.nombre));
const reservasDe = f => vals('reservas').filter(r=>r.fecha===f && r.estado!=='Cancelada').sort((a,b)=>(a.hora||'').localeCompare(b.hora||''));
const datosCompletos = c => c && (!c.facturaPropia || (c.nombre && c.tipoDoc && c.numDoc && c.direccion && c.email && c.telefono));
function estadoMesa(id){
  const st = S.mesas[id];
  if(st && st.estado && st.estado!=='libre') return {estado:st.estado, reserva:S.reservas[st.reservaId], desde:st.desde};
  const r = reservasDe(today()).find(r=>mesasDe(r).includes(id) && ['Pendiente','Confirmada'].includes(r.estado));
  return r ? {estado:'reservada', reserva:r} : {estado:'libre'};
}
const pagadoCx = x => (x.pagos||[]).reduce((s,p)=>s+(Number(p.valor)||0),0);
const saldoCx = x => Math.max(0,(Number(x.valor)||0)-pagadoCx(x));
const diasMora = x => Math.round((new Date(today()+'T12:00')-new Date(x.vence+'T12:00'))/864e5);
const estadoCx = x => x.anulada?'Anulada':saldoCx(x)<=0?'Pagada':x.vence<today()?'Vencida':x.vence<=addDays(today(),5)?'Por vencer':'Al día';
const eventos = () => vals('reservas').filter(r=>r.tipo==='Evento');
const antDeEvento = r => vals('anticipos').filter(a=>a.reservaId===r.id && !['Devuelto','Anulado','Devolución solicitada'].includes(a.estado));
const cxDeEvento = r => vals('cartera').filter(x=>x.reservaId===r.id && !x.anulada);
const pagadoEvento = r => total(antDeEvento(r)) + cxDeEvento(r).reduce((s,x)=>s+pagadoCx(x),0);
function estadoEvento(r){
  if(r.estado==='Cancelada') return {t:'Cancelado',c:''};
  if(r.fecha>=today()){ const a=total(antDeEvento(r)); if(!a) return {t:'Sin anticipo',c:r.fecha<=addDays(today(),15)?'pink':'amber'}; return {t:a>=(r.valorEvento||0)?'Pagado completo':'Con anticipo',c:a>=(r.valorEvento||0)?'ok':'blue'}; }
  const cx=cxDeEvento(r); if(!cx.length) return pagadoEvento(r)>=(r.valorEvento||0)&&r.valorEvento?{t:'Pagado',c:'ok'}:{t:'Realizado · por facturar',c:'amber'};
  const e=cx.map(estadoCx); if(e.includes('Vencida')) return {t:'Cartera vencida',c:'pink'}; if(e.every(x=>x==='Pagada')) return {t:'Pagado',c:'ok'}; return {t:'Facturado · por cobrar',c:'olive'};
}
const cxAbiertas = () => vals('cartera').filter(x=>['Vencida','Por vencer','Al día'].includes(estadoCx(x)));
const cxVencidas = () => vals('cartera').filter(x=>estadoCx(x)==='Vencida');
const cxPorVencer = () => vals('cartera').filter(x=>estadoCx(x)==='Por vencer');
const totalSaldo = arr => arr.reduce((s,x)=>s+saldoCx(x),0);
const tagCx = x => ({'Vencida':`<span class="tag pink">Vencida · ${diasMora(x)} días</span>`,'Por vencer':`<span class="tag amber">Vence en ${-diasMora(x)} días</span>`,'Al día':'<span class="tag ok">Al día</span>','Pagada':'<span class="tag">Pagada</span>','Anulada':'<span class="tag">Anulada</span>'})[estadoCx(x)];
const tortasSinPagar = () => vals('reservas').filter(r=>r.torta?.lleva && r.torta.estado!=='Pagada' && r.fecha>=today() && r.fecha<=addDays(today(),3) && r.estado!=='Cancelada');
const tagTorta = r => r.torta?.lleva ? (r.torta.estado==='Pagada'?'<span class="tag ok">Torta · pagada</span>':'<span class="tag pink">Torta · falta pago</span>') : '';
const tagAnt = a => {
  if(PEND_CRUCE.includes(a.estado) && a.fechaAplicacion && a.fechaAplicacion<today()) return `<span class="tag pink">Vencido · ${esc(a.estado)}</span>`;
  return {'Por verificar':'<span class="tag amber">Por verificar</span>','Verificado':'<span class="tag blue">Verificado · por cruzar</span>','Aplicado en factura':'<span class="tag olive">Aplicado · falta ajuste</span>','Conciliado':'<span class="tag ok">Conciliado</span>','Devolución solicitada':'<span class="tag pink">Devolución solicitada</span>','Devuelto':'<span class="tag">Devuelto</span>','Anulado':'<span class="tag">Anulado</span>'}[a.estado] || `<span class="tag">${esc(a.estado)}</span>`;
};
const tagBono = b => ({Activo:'<span class="tag ok">Activo</span>',Redimido:'<span class="tag">Redimido</span>',Vencido:'<span class="tag pink">Vencido</span>',Anulado:'<span class="tag">Anulado</span>'})[bonoEstado(b)];

function viewReservas(){
  const t = today(); let list = vals('reservas'); const f = UI.resFiltro;
  if(f==='hoy') list = list.filter(r=>r.fecha===t);
  else if(f==='manana') list = list.filter(r=>r.fecha===addDays(t,1));
  else if(f==='semana') list = list.filter(r=>r.fecha>=t && r.fecha<=addDays(t,7));
  else if(f==='proximas') list = list.filter(r=>r.fecha>=t);
  if(UI.resQ){ const q = norm(UI.resQ); list = list.filter(r=>norm(nombreDe(r)+' '+(cliente(r.clienteId)?.telefono||'')+' '+r.tipo).includes(q)); }
  list.sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));

function pickerMesas(){

function soporteInput(id, sop){

async function leerSoporte(file){
  if(!file) return null;
  if(file.type==='application/pdf'){ if(file.size>240000){ toast('El PDF es muy pesado: envía una captura de pantalla'); return null; } return await new Promise(r=>{const fr=new FileReader(); fr.onload=()=>r({data:fr.result,nombre:file.name}); fr.readAsDataURL(file);}); }
  const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });
  const max=1100, k=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height); let q=.7, data=c.toDataURL('image/jpeg',q); while(data.length>220000 && q>.3){ q-=.1; data=c.toDataURL('image/jpeg',q); }
  return {data, nombre:file.name};
}
function validStep(){
  const e = {}, R=W.res, C=W.cli, A=W.ant;
  if(W.step===1){ if(!R.fecha) e.fecha='Elige la fecha'; if(!R.hora) e.hora='Elige la hora'; if(!(+R.personas>0)) e.personas='Mínimo 1'; if(R.tipo==='Evento' && !(Number(digits(R.valorEvento))>0)) e.valorEvento='Escribe el valor cotizado del evento'; const T=W.torta; if(T.lleva){ if(T.detalle.trim().length<3) e.torta_detalle='Describe la torta'; if(!(Number(digits(T.valor))>0)) e.torta_valor='Escribe el valor'; if(!T.estado) e.torta_estado='Indica si ya está pagada'; }
    if(!puedeMesas()){} else if(!R.mesas.length) e.mesas='Elige al menos una mesa para la reserva'; else { const t=mesasOcupadasEn(R.fecha,R.hora,W.editId); const c=R.mesas.filter(m=>t.has(m)); if(c.length) e.mesas='La mesa '+c.join(', ')+' ya está reservada a esa hora'; } }
  if(W.step===2){ if(digits(C.telefono).length<7) e.telefono='Escribe un celular válido'; if(C.nombre.trim().length<3) e.nombre='Escribe el nombre'; }
  if(W.step===3){
    if(C.facturaPropia===null) e.facturaPropia='Selecciona una opción';
    if(C.facturaPropia){
      if(C.tipoDoc!=='NIT' && C.nombre.trim().split(/\s+/).length<2) e.nombre='Nombre y apellido completos';
      if(!/^[0-9A-Za-z]{4,15}$/.test(C.numDoc.replace(/[.\s-]/g,''))) e.numDoc='Número de documento no válido';
      if(C.direccion.trim().length<6) e.direccion='Escribe la dirección completa';
      if(!/^\S+@\S+\.\S+$/.test(C.email)) e.email='La factura electrónica necesita un correo válido';
      if(digits(C.telefono).length<7) e.telefono='Teléfono no válido';
    }
    if(C.facturaPropia!==null && !C.avisoOk) e.avisoOk='Confirma que el cliente conoce el aviso';
  }
  if(W.step===4){ if(A.deja===null) e.deja='Selecciona una opción'; if(A.deja){ if(!(Number(digits(A.valor))>0)) e.valor='Escribe el valor'; if(!A.fechaPago) e.fechaPago='Fecha del pago'; if(!A.soporte) e.soporte='Sube el soporte del pago: sin soporte no se registra'; } }
  W.errs = e; return !Object.keys(e).length;
}
function saveWizard(){

  const c = {...prev, nombre:C.nombre.trim(), telefono:digits(C.telefono), email:C.email.trim(), facturaPropia:!!C.facturaPropia, avisoAceptado:now};

function saveAnticipo(){
  const d = {clienteId:$('#aCli').value, reservaId:$('#aRes').value, concepto:$('#aCon').value.trim(), valor:Number(digits($('#aVal').value)), medio:$('#aMed').value, fechaPago:$('#aFP').value, fechaAplicacion:$('#aFA').value, referencia:$('#aRef').value.trim(), estado:'Por verificar', creado:today()};

}

    ajuste:{t:'Ajuste contable',s:'Reclasificación del medio de pago QR contra la cuenta '+CUENTA_ANT,f:[['ajuste','N° documento de ajuste','AJ-…']],ok:'Conciliado',msg:v=>`Ajuste contable ${v.ajuste}`},

function pasoOk(){

}

  else if(f==='Este mes') list = list.filter(r=>r.fecha.slice(0,7)===t.slice(0,7));
  else if(f==='Realizados') list = list.filter(r=>r.fecha<t);
  else if(f==='Con pendientes') list = list.filter(r=>['pink','amber'].includes(estadoEvento(r).c));
  if(UI.evQ){ const q=norm(UI.evQ); list=list.filter(r=>norm(nombreDe(r)+' '+(r.ocasion||'')+' '+(r.detalleEvento||'')).includes(q)); }
  list.sort((a,b)=> f==='Realizados' ? b.fecha.localeCompare(a.fecha) : a.fecha.localeCompare(b.fecha));
  const prox = eventos().filter(r=>r.fecha>=t && r.estado!=='Cancelada');
  const vProx = prox.reduce((s,r)=>s+(r.valorEvento||0),0), aProx = prox.reduce((s,r)=>s+total(antDeEvento(r)),0);

    <div class="kpi ${cxVencidas().length?'alert':''}" data-go="cartera"><h3>Cartera de eventos</h3><div class="n">${money(porCobrar)}</div><div class="d">por cobrar de eventos realizados</div></div></div>
  <div class="toolbar"><div class="seg">${['Próximos','Este mes','Con pendientes','Realizados','Todos'].map(k=>`<button data-evf="${k}" class="${f===k?'on':''}">${k}</button>`).join('')}</div>
    <div class="search">${ic('search')}<input id="evQ" placeholder="Cliente, ocasión o detalle" value="${esc(UI.evQ)}"></div></div>
  ${Object.keys(byMonth).length?Object.entries(byMonth).map(([k,rs])=>`<h3 style="margin:20px 0 10px;text-transform:uppercase">${esc(mes(k))} · ${rs.length} evento(s) · ${money(rs.reduce((s,r)=>s+(r.valorEvento||0),0))}</h3><div class="evgrid">${rs.map(cardEvento).join('')}</div>`).join(''):'<div class="empty">No hay eventos en este filtro.</div>'}`;

  }

function saveBono(){
  const B = window._bono, cort = B.tipo==='Cortesía', g = id=>($('#'+id)?.value||'').trim();

  if(cort){ d.autorizadoPor=g('bAut'); d.motivo=g('bMot'); } else { d.medio=g('bMed'); }
  const e=[]; if(!(d.valor>0)) e.push('el valor'); if(!cort && !d.comprador) e.push('quién lo compra'); if(!d.beneficiario) e.push('para quién es'); if(d.telefono.length<7) e.push('el celular');

function bindRegistro(){
  const grab = ()=>{ ['nombre','telefono','tipoDoc','numDoc','direccion','email'].forEach(k=>{ const el=$('#g_'+k); if(el) REG[k]=el.value; }); REG.hab=$('#g_hab')?.checked; REG.av=$('#g_av')?.checked; };

    if(a==='si'||a==='no'){ grab(); REG.facturaPropia = a==='si'; delete REG.errs.facturaPropia; render(); }
    if(a==='otra'){ REG={facturaPropia:null,enviado:false,errs:{},tipoDoc:TIPOS_DOC[0]}; render(); }
    if(a==='enviar'){ grab(); const e={};
      if((REG.nombre||'').trim().split(/\s+/).length<2) e.nombre='Escribe tu nombre y apellido';
      if(digits(REG.telefono).length<7) e.telefono='Celular no válido';
      if(REG.facturaPropia===null) e.facturaPropia='Elige una opción';
      if(REG.facturaPropia){ if(!(REG.numDoc||'').trim()) e.numDoc='Requerido'; if((REG.direccion||'').trim().length<6) e.direccion='Escribe la dirección'; if(!/^\S+@\S+\.\S+$/.test(REG.email||'')) e.email='Correo no válido'; }
      if(!REG.av) e.av='Confirma que leíste el aviso'; if(!REG.hab) e.hab='Necesitamos tu autorización';
      REG.errs=e; if(Object.keys(e).length){ render(); return; }
      const tel=digits(REG.telefono), ex=vals('clientes').find(c=>c.telefono===tel), id=ex?ex.id:uid('cli');
      const d={...(ex||{creado:today()}),nombre:REG.nombre.trim(),telefono:tel,email:(REG.email||'').trim(),facturaPropia:REG.facturaPropia,origen:'formulario',avisoAceptado:today(),autorizaDatos:today()};
      if(REG.facturaPropia){ Object.assign(d,{tipoDoc:REG.tipoDoc,numDoc:REG.numDoc.replace(/[.\s-]/g,''),dv:REG.tipoDoc==='NIT'?dvNit(REG.numDoc):'',direccion:REG.direccion.trim()}); if(ex?.siesa!=='Creado') d.siesa='Por crear'; }
      if(REAL && !USER){ SB.rpc('registrar_cliente',{p:d}).then(({error})=>{ if(error){ toast('No pudimos guardar tus datos. Intenta de nuevo.'); return; } REG.enviado=true; render(); }); return; }
      save('clientes',id,d); REG.enviado=true; render(); }
  });
}

}

document.addEventListener('keydown', e=>{ if(e.key==='Escape' && $('#modal').innerHTML) closeModal(); if(e.key==='Enter' && e.target.id && /^(p_|rFac)/.test(e.target.id)){ const b=$('[data-act="paso-ok"],[data-act="bono-redok"]'); b&&b.click(); } });

function bindView(){
  const bs = (id,key,extra)=>{ const el=$('#'+id); if(!el) return; el.oninput=()=>{ UI[key]=el.value; extra&&extra(); const p=el.selectionStart; render(); const n=$('#'+id); n.focus(); n.setSelectionRange(p,p); }; };
  bs('resQ','resQ'); bs('antQ','antQ'); bs('cliQ','cliQ'); bs('bonoQ','bonoQ'); bs('cxQ','cxQ'); bs('evQ','evQ'); bs('cajaQ','cajaQ',()=>{UI.cajaSel=null;});
  document.querySelectorAll('[data-asig]').forEach(s=>s.onchange=()=>{ const rr=S.reservas[s.dataset.asig]; if(s.value){ save('reservas',rr.id,{...rr,mesas:[s.value],hist:hist(rr,'Mesa asignada: '+mesaLabel(s.value))}); toast(`${nombreDe(rr)} → ${mesaLabel(s.value)}`); } });
}
const selCaja = cid => { UI.cajaSel=cid; UI.cajaQ=S.clientes[cid]?.nombre||''; closeModal(); go('caja'); };
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-go],[data-act],[data-res],[data-mesa],[data-resf],[data-antf],[data-antf2],[data-bonof],[data-cxf],[data-evf],[data-cajasel],[data-copy],[data-rol]');
  if(!el) return;
  if(el.dataset.rol){ const r=ROLES.find(x=>x.id===el.dataset.rol); ROLE={id:r.id,nombre:r.id==='reservas'?'Reservas':r.id==='tesoreria'?'Tesorería':r.id==='admin'?'Gerencia':'Caja'}; try{sessionStorage.setItem('volver-rol',JSON.stringify(ROLE));}catch(x){} location.hash=r.inicio; render(); return; }
  if(el.dataset.copy!==undefined){ copyText(el.dataset.copy); return; }
  if(el.dataset.resf){ UI.resFiltro=el.dataset.resf; render(); return; }
  if(el.dataset.antf){ UI.antFiltro=el.dataset.antf; render(); return; }
  if(el.dataset.antf2){ UI.antFiltro=el.dataset.antf2; render(); return; }
  if(el.dataset.bonof){ UI.bonoFiltro=el.dataset.bonof; render(); return; }
  if(el.dataset.evf){ UI.evFiltro=el.dataset.evf; render(); return; }
  if(el.dataset.cxf){ UI.cxFiltro=el.dataset.cxf; render(); return; }
  if(el.dataset.cajasel){ selCaja(el.dataset.cajasel); return; }
  if(el.dataset.mesa){ openMesa(el.dataset.mesa); return; }
  if(el.dataset.res){ openReserva(S.reservas[el.dataset.res]); return; }
  if(el.dataset.go){ if(el.dataset.cid){ selCaja(el.dataset.cid); return; } if(el.dataset.f) UI.antFiltro=el.dataset.f; go(el.dataset.go); return; }
  const a = el.dataset.act, id = el.dataset.id;
  if(el.tagName==='A' && !el.href.startsWith('https://wa.me')) e.preventDefault();
  switch(a){
    case 'close': closeModal(); break;
    case 'salir': cerrarSesion(); break;
    case 'usr-save': guardarUsuario(id); break;
    case 'rol-cambiar': ROLE=null; try{sessionStorage.removeItem('volver-rol');}catch(x){} closeModal(); render(); break;
    case 'res-new': newWizard(); break;
    case 'w-next': if(validStep()){ W.step++; renderWizard(); $('#modal .scrim').scrollTop=0; } else renderWizard(); break;
    case 'w-back': W.step--; W.errs={}; renderWizard(); $('#modal .scrim').scrollTop=0; break;
    case 'w-save': saveWizard(); break;
    case 'w-unlink': W.clienteId=''; W.cli={...W.cli,nombre:'',telefono:'',email:'',numDoc:'',direccion:'',facturaPropia:null}; renderWizard(); break;
    case 'res-estado': { const rr=S.reservas[id]; save('reservas',id,{...rr,estado:el.dataset.v,hist:hist(rr,'Estado: '+el.dataset.v)}); openReserva(S.reservas[id]); break; }
    case 'res-edit': { const rr=S.reservas[id], c=S.clientes[rr.clienteId]||{}; closeModal(); newWizard({editId:id, clienteId:rr.clienteId, res:{...rr}, cli:{...c, facturaPropia:c.facturaPropia??null, tipoDoc:c.tipoDoc||TIPOS_DOC[0], numDoc:c.numDoc||'', direccion:c.direccion||'', email:c.email||'', avisoOk:!!c.avisoAceptado}}); break; }
    case 'torta-pago': { const rr=S.reservas[id]; formAnticipo({clienteId:rr.clienteId, reservaId:rr.id, fechaAplicacion:rr.fecha, concepto:'Pago torta '+fdate(rr.fecha)+' · '+rr.torta.detalle, valor:rr.torta.valor, tortaDe:rr.id}); break; }
    case 'cx-new': formCx(id?{reservaId:id}:{}); break;
    case 'ev-new': newWizard({res:{tipo:'Evento'}}); break;
    case 'ev-ver': verEvento(id, el.dataset.tab||'resumen'); break;
    case 'ev-ant': { const rr=S.reservas[id]; formAnticipo({clienteId:rr.clienteId, reservaId:rr.id, fechaAplicacion:rr.fecha, concepto:'Anticipo evento '+(rr.ocasion||'')+' '+fdate(rr.fecha)}); break; }
    case 'cx-save': saveCx(); break;
    case 'cx-ver': verCx(id); break;
    case 'cx-pago': pagoCx(id); break;
    case 'cx-pagook': pagoCxOk(id); break;
    case 'res-ant': { const rr=S.reservas[id]; formAnticipo({clienteId:rr.clienteId, reservaId:rr.id, fechaAplicacion:rr.fecha, concepto:'Anticipo '+rr.tipo.toLowerCase()+' '+fdate(rr.fecha)}); break; }
    case 'ant-new': formAnticipo(); break;
    case 'ant-save': saveAnticipo(); break;
    case 'ant-ver': verAnticipo(id); break;
    case 'ant-verificar': pasoAnticipo(id,'verificar'); break;
    case 'ant-aplicar': pasoAnticipo(id,'aplicar'); break;
    case 'ant-ajuste': pasoAnticipo(id,'ajuste'); break;
    case 'ant-devsol': pasoAnticipo(id,'devsol'); break;
    case 'ant-devuelto': pasoAnticipo(id,'devuelto'); break;
    case 'paso-ok': pasoOk(); break;
    case 'ant-asociar': { const cid=$('#asocCli').value; if(!cid) return; const an=S.anticipos[id]; const d={...an,clienteId:cid,hist:hist(an,'Asociado al cliente '+S.clientes[cid].nombre)}; delete d.clienteNombre; save('anticipos',id,d); verAnticipo(id); toast('Anticipo asociado'); break; }
    case 'ant-asocnuevo': { const an=S.anticipos[id]; formCliente(null, cid=>{ const d={...S.anticipos[id],clienteId:cid,hist:hist(an,'Asociado a cliente nuevo')}; delete d.clienteNombre; save('anticipos',id,d); verAnticipo(id); }); $('#kNom').value=an.clienteNombre||''; break; }
    case 'ant-csv': { const rows=[['Cliente','Documento','Concepto','Valor','Medio','Fecha pago','Fecha aplicación','Estado','Recibo de caja','Factura','Ajuste','Referencia']].concat(vals('anticipos').map(x=>{const c=cliente(x.clienteId)||{};return [nombreDe(x),c.numDoc||'',x.concepto,x.valor,x.medio||'',x.fechaPago||'',x.fechaAplicacion||'',x.estado,x.rc||'',x.factura||'',x.ajuste||'',x.referencia||''];})); copyText(rows.map(r=>r.join('\t')).join('\n')); break; }
    case 'conta-csv-ajustes': { const rows=[['Factura','Fecha','Cliente','Documento','Recibo de caja','Valor']].concat(porAjustar().map(x=>{const c=cliente(x.clienteId)||{};return [x.factura,x.fechaFactura,nombreDe(x),c.numDoc||'',x.rc||'',x.valor];})); copyText(rows.map(r=>r.join('\t')).join('\n')); break; }
    case 'conta-csv-terceros': { const rows=[['Tipo documento','Número','DV','Nombre o razón social','Dirección','Teléfono','Correo']].concat(tercerosPorCrear().map(c=>[(c.tipoDoc||'').split(' ·')[0],c.numDoc,c.dv||'',c.nombre,c.direccion,c.telefono,c.email])); copyText(rows.map(r=>r.join('\t')).join('\n')); break; }
    case 'cli-creado': { const c=S.clientes[id]; save('clientes',id,{...c,siesa:'Creado',siesaFecha:today()}); toast(c.nombre+' marcado como creado en SIESA'); break; }
    case 'cli-new': formCliente(); break;
    case 'cli-edit': formCliente(id); break;
    case 'cli-save': saveCliente(); break;
    case 'cli-res': { const c=S.clientes[id]; closeModal(); newWizard({clienteId:c.id, cli:{...c, facturaPropia:c.facturaPropia??null, tipoDoc:c.tipoDoc||TIPOS_DOC[0], numDoc:c.numDoc||'', direccion:c.direccion||'', email:c.email||''}}); break; }
    case 'caja-clear': UI.cajaSel=null; UI.cajaQ=''; render(); setTimeout(()=>$('#cajaQ')?.focus(),0); break;
    case 'bono-new': formBono(); break;
    case 'bono-save': saveBono(); break;
    case 'bono-ver': verBono(id); break;
    case 'bono-redimir': redimirBono(id); break;
    case 'bono-redok': { const f=$('#rFac').value.trim(); if(!f){ $('#rErr').textContent='Anota el número de factura'; return; } const b=S.bonos[id]; save('bonos',id,{...b,estado:'Redimido',redFecha:today(),redFactura:f,redPor:quien(),hist:hist(b,'Redimido completo en la factura '+f)}); verBono(id); toast('Bono redimido en '+f); break; }
    case 'mesa-sentar': { const rid=$('#mesaRes')?.value||''; if(rid){ const rr=S.reservas[rid]; save('reservas',rid,{...rr,mesas:mesasDe(rr).includes(id)?mesasDe(rr):[...mesasDe(rr),id],estado:'Llegó',hist:hist(rr,'Llegó · '+mesaLabel(id))}); } save('mesas',id,{estado:'ocupada',reservaId:rid,desde:nowHM()}); closeModal(); break; }
    case 'mesa-llego': { const rr=S.reservas[el.dataset.r]; save('reservas',rr.id,{...rr,estado:'Llegó',hist:hist(rr,'Llegó · '+mesaLabel(id))}); mesasDe(rr).forEach(m=>save('mesas',m,{estado:'ocupada',reservaId:rr.id,desde:nowHM()})); closeModal(); const pa=cruzarDe(rr.clienteId); if(pa.length) toast(`${nombreDe(rr)} tiene ${money(total(pa))} de anticipo`); break; }
    case 'mesa-quitar': { const rr=S.reservas[el.dataset.r]; save('reservas',rr.id,{...rr,mesas:mesasDe(rr).filter(m=>m!==id)}); closeModal(); break; }
    case 'mesa-cuenta': { const st=S.mesas[id]; save('mesas',id,{...st,estado:'cuenta'}); closeModal(); const rr=S.reservas[st.reservaId]; if(rr && cruzarDe(rr.clienteId).length) toast('Caja verá el aviso: esta mesa tiene anticipo'); break; }
    case 'mesa-liberar': { const st=S.mesas[id]||{}; if(st.reservaId && S.reservas[st.reservaId]){ const rr=S.reservas[st.reservaId]; save('reservas',rr.id,{...rr,estado:'Finalizada',hist:hist(rr,'Finalizada')}); } save('mesas',id,{estado:'libre',reservaId:'',desde:''}); closeModal(); break; }
    case 'mesa-facturar': { if(el.dataset.cid) selCaja(el.dataset.cid); else { closeModal(); go('caja'); } break; }
  }
});

if(REAL){ render(); iniciarReal(); SB.auth.onAuthStateChange((ev)=>{ if(ev==='SIGNED_OUT'){ USER=null; PERFIL=null; render(); } }); }
else { seedDemo(); render(); }
</script>
</body>
</html>
